name: Generate Profile Statistics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
  pull_request:
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'README.md'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: profile-statistics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Demon-inz4ne&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Demon-inz4ne&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Demon-inz4ne&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated SVG files
        run: |
          for file in profile/stats.svg profile/top-langs.svg profile/streak.svg; do
            test -s "$file" || { echo "::error::$file is missing or empty"; exit 1; }
            grep -q '<svg' "$file" || { echo "::error::$file is not an SVG"; exit 1; }
          done

      - name: Publish cards on main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile statistics [skip ci]"
            git push
          else
            echo "Profile cards are already up to date."
          fi
